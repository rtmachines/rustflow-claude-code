name: rustflow-gates
# Same gates as the Claude Code hooks and the rustflow orchestrator: green locally = green in CI.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      # fmt --check, clippy -D warnings, nextest, doc tests, cargo-deny (if deny.toml), [[gates.extra]]
      - run: python .rustflow/gates.py ci
