name: rustflow-tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare Git
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Build wheel and install test tools
        run: |
          python -m pip install build pytest ruff
          python -m build --wheel rustflow --outdir dist
      - name: Install wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel, = pathlib.Path("dist").glob("*.whl")
          subprocess.run([sys.executable, "-m", "pip", "install", str(wheel)], check=True)
      - name: Lint package and tests
        run: python -m ruff check rustflow
      - name: Test installed product outside source checkout
        run: python .github/scripts/test-installed.py
